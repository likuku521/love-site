<script>
/* ===== 星点生成 ===== */
(function(){
  const f=document.getElementById('starField'),n=innerWidth<600?50:90;
  for(let i=0;i<n;i++){const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.setProperty('--d',(2+Math.random()*4)+'s');
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.width=s.style.height=(Math.random()<.15?3:1+Math.random()*1.5)+'px';
    f.appendChild(s);}
})();

/* ===== 飘落爱心 ===== */
(function(){
  const cv=document.getElementById('heartCanvas'),ctx=cv.getContext('2d');
  let W,H,hearts=[];
  function mk(any){return{x:Math.random()*W,y:any?Math.random()*H:-20,
    s:9+Math.random()*15,vy:.5+Math.random()*1.1,vx:(Math.random()-.5)*.5,
    rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.02,a:.2+Math.random()*.5,
    c:Math.random()<.35?'#f9a8d4':(Math.random()<.5?'#c084fc':'#f0abfc')}}
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    const n=innerWidth<600?22:36;hearts=[];for(let i=0;i<n;i++)hearts.push(mk(true));}
  function draw(){ctx.clearRect(0,0,W,H);
    for(const h of hearts){h.y+=h.vy;h.x+=h.vx;h.rot+=h.vr;
      if(h.y>H+30)Object.assign(h,mk(false));
      ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.globalAlpha=h.a;
      ctx.font=h.s+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=h.c;ctx.fillText('♥',0,0);ctx.restore();}
    requestAnimationFrame(draw);}
  resize();addEventListener('resize',resize);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)draw();
})();

/* ===== 倒计时暗号 ===== */
(function(){
  const btn=document.getElementById('btnCount'),cd=document.getElementById('countdown'),
        num=document.getElementById('cdNum'),tag=document.getElementById('cdTag');
  function show(t,last){num.textContent=t;num.classList.remove('pop');void num.offsetWidth;
    num.classList.add('pop');
    if(last){tag.classList.add('show');setTimeout(()=>{
      cd.classList.remove('show');document.body.style.overflow='';
      num.classList.remove('pop');tag.classList.remove('show');
      document.getElementById('story').scrollIntoView({behavior:'smooth'});},1100);}}
  btn.addEventListener('click',()=>{
    document.body.style.overflow='hidden';cd.classList.add('show');
    show(3);setTimeout(()=>show(2),900);setTimeout(()=>show(1),1800);
    setTimeout(()=>show('♥',true),2700);});
})();

/* ===== 滚动渐入 + 星光点亮 + 情书书写 ===== */
(function(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;
    e.target.classList.add('visible');
    if(e.target.classList.contains('t-node'))e.target.classList.add('lit');
    if(e.target.id==='letterPaper')e.target.classList.add('written');
    io.unobserve(e.target);}),{threshold:.15});
  document.querySelectorAll('.reveal,#letterPaper').forEach(el=>io.observe(el));
})();

/* ===== 便签翻牌 ===== */
document.querySelectorAll('.note').forEach(n=>
  n.addEventListener('click',()=>n.classList.toggle('flipped')));

/* ===== 终章：双按钮彩蛋 + 烟花 ===== */
(function(){
  const yes=document.getElementById('btnYes'),no=document.getElementById('btnNo');
  let noCount=0,ys=1;
  const msgs=['再想想？','真的再想想？','我可是认真的…','好吧，不跑了','…我同意了'];
  no.addEventListener('click',()=>{
    noCount++;ys*=1.5;
    yes.style.transform=`scale(${Math.min(ys,3.2)})`;
    if(noCount<=4){
      no.style.transform=`translate(${(Math.random()*2-1)*120}px,${(Math.random()*2-1)*80}px) scale(${Math.max(.55,1-noCount*.11)})`;
      no.textContent=msgs[noCount-1];
    }else{
      no.textContent='好吧，我同意了 ❤';
      no.style.borderColor='#f9a8d4';no.style.color='#f9a8d4';
      no.style.pointerEvents='none';no.style.transform='scale(1.05)';
    }
  });
  yes.addEventListener('click',()=>{
    document.getElementById('resultMsg').classList.add('show');
    fireworks();
  });
})();
function fireworks(){
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=['#f9a8d4','#c084fc','#f0abfc','#fcd9a0','#fff'];
  let parts=[],rockets=[],launches=0;
  function explode(x,y){const n=60+Math.random()*30|0;
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.3,sp=2+Math.random()*4.5;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
        dec:.012+Math.random()*.01,c:colors[Math.random()*colors.length|0],
        heart:Math.random()<.3,s:2+Math.random()*2.5});}}
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    rockets=rockets.filter(r=>{r.y+=r.vy;r.vy*=.985;
      ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.5,0,7);ctx.fill();
      if(r.vy>-1.5){explode(r.x,r.y);return false;}return true;});
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.99;p.life-=p.dec;
      if(p.life<=0)return false;
      ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
      if(p.heart){ctx.font=(10*p.life+6)+'px serif';ctx.textAlign='center';ctx.fillText('♥',p.x,p.y);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.s*p.life,0,7);ctx.fill();}
      ctx.globalAlpha=1;return true;});
    if(launches<6&&Math.random()<.06){launches++;
      rockets.push({x:innerWidth*(.15+Math.random()*.7),y:innerHeight+10,
        vy:-(9+Math.random()*4),c:colors[Math.random()*colors.length|0]});}
    if(rockets.length||parts.length||launches<6)requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);}
  for(let i=0;i<2;i++)rockets.push({x:innerWidth*(.3+i*.4),y:innerHeight+10,
    vy:-(9+Math.random()*3),c:colors[i]});
  launches=2;tick();
}
</script>
</html>
