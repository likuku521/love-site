<style>
/* ===== 手账便签（理由） ===== */
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding-bottom:20px}
@media(max-width:640px){.notes{grid-template-columns:1fr}}
.note{position:relative;min-height:170px;padding:26px 22px 22px;border-radius:3px;
  cursor:pointer;perspective:900px}
.note-inner{position:relative;width:100%;height:100%;min-height:170px;transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.35,.15,.2,1)}
.note.flipped .note-inner{transform:rotateY(180deg)}
.note-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.note-front{background:linear-gradient(160deg,#f7ecd7,#efd9b8);color:#6b5433;
  box-shadow:0 12px 28px rgba(0,0,0,.45);transform:rotate(var(--nrot,0deg))}
.note-front .no{font-family:var(--serif);font-size:15px;letter-spacing:.4em}
.note-front .tape{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:74px;height:24px;background:rgba(240,171,252,.55);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.note-front .heart{font-size:22px;color:#c2547d}
.note-back{background:linear-gradient(160deg,#8b5cf6,#c084fc);color:#fff;
  transform:rotateY(180deg);font-size:16px;line-height:1.9;letter-spacing:.05em;
  box-shadow:0 12px 28px rgba(0,0,0,.45)}

/* ===== 情书（逐行书写） ===== */
.letter-stage{display:flex;justify-content:center;padding:6px 0 30px}
.letter-paper{position:relative;width:min(94%,520px);background:
  linear-gradient(180deg,#fffdf6,#fdf6ea);border-radius:6px;
  padding:44px 36px 40px;color:#4a3a2c;
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 60px rgba(220,190,140,.12);
  transform:rotate(-.6deg)}
.letter-paper::before{content:"";position:absolute;top:0;left:36px;right:36px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,160,110,.5),transparent)}
.letter-paper .stamp{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0abfc,#a21caf);display:grid;place-items:center;
  color:#fff;font-size:19px;box-shadow:0 4px 10px rgba(0,0,0,.3);transform:rotate(8deg)}
.wline{font-family:var(--serif);font-size:17.5px;line-height:2.15;margin-bottom:6px;
  opacity:0;transform:translateY(10px);filter:blur(2px);
  transition:opacity .7s ease var(--wd,0s),transform .7s ease var(--wd,0s),filter .7s ease var(--wd,0s)}
.letter-paper.written .wline{opacity:1;transform:none;filter:blur(0)}
.wline.indent{text-indent:2em}
.wline .hl{color:#a21caf;font-weight:700}
.wsign{text-align:right;font-family:var(--serif);font-size:19px;color:#8a5a2e;margin-top:14px}

/* ===== 终章（唯一答案） ===== */
#final{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding-bottom:14vh}
.final-kicker{font-size:12px;letter-spacing:.55em;color:var(--fuchsia);margin-bottom:22px}
.final-q{font-family:var(--serif);font-size:clamp(34px,8.5vw,58px);line-height:1.4;
  background:linear-gradient(120deg,#f5d0fe,var(--rose) 60%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
.final-only{color:var(--ink-dim);font-size:14px;letter-spacing:.3em;margin-bottom:58px}
.btn-yes-only{position:relative;padding:22px 76px;border:none;border-radius:99px;cursor:pointer;
  font-family:var(--serif);font-size:24px;letter-spacing:.5em;color:#fff;padding-left:88px;
  background:linear-gradient(135deg,#e879f9,#a855f7 55%,#7c3aed);
  box-shadow:0 14px 50px rgba(168,85,247,.55),0 0 0 0 rgba(232,121,249,.5);
  animation:heartbeat 1.8s ease-in-out infinite;transition:transform .25s}
.btn-yes-only:hover{transform:translateY(-3px) scale(1.05)}
.btn-yes-only:active{transform:scale(.96)}
.btn-no{position:relative;margin-top:22px;padding:11px 30px;font-size:13px;letter-spacing:.25em;
  color:var(--ink-dim);background:transparent;border:1px solid rgba(192,132,252,.4);
  border-radius:99px;cursor:pointer;transition:all .3s}
.btn-no:hover{border-color:var(--rose);color:var(--rose)}
.final-foot{margin-top:60px;color:var(--ink-dim);font-size:12px;letter-spacing:.3em;line-height:2.2}
.final-foot .d{color:var(--gold)}

/* 结果层 + 烟花 */
#resultMsg{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(circle at 50% 45%,rgba(42,17,72,.9),rgba(11,5,22,.96))}
#resultMsg.show{display:flex}
.res-big{font-family:var(--serif);font-size:clamp(44px,10vw,72px);margin-bottom:18px;
  background:linear-gradient(120deg,var(--rose),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent;animation:riseIn 1s cubic-bezier(.2,.7,.2,1) both}
.res-line{color:var(--ink);font-size:17px;letter-spacing:.14em;line-height:2.2;
  animation:riseIn 1s ease .35s both}
.res-date{margin-top:30px;color:var(--gold);font-size:13px;letter-spacing:.25em;
  animation:riseIn 1s ease .7s both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
footer{padding:56px 0 44px;text-align:center;color:var(--ink-dim);font-size:12px;letter-spacing:.3em}
footer .h{color:var(--fuchsia)}

/* ===== 移动端适配 ===== */
@media(max-width:640px){
  section{padding-top:13vh}
  main{padding:0 16px}
  /* 封面紧凑 */
  .hero-name{margin:10px 0 8px}
  .hero-date{margin-top:14px;font-size:12px}
  .btn-pulse{width:104px;height:104px;font-size:15px;margin-top:50px}
  .scroll-hint{font-size:10px}
  /* 宝丽来：单列大图 + 交替偏移（保留灵动） */
  #photos .wall{grid-template-columns:1fr;gap:36px 0;padding-bottom:10px}
  .p1,.p2,.p3,.p4,.p5,.p6,.p7{grid-column:auto;margin-top:0}
  .p1{margin-left:-3%}.p2{margin-left:5%}.p3{margin-left:-5%}.p4{margin-left:4%}
  .p5{margin-left:-4%}.p6{margin-left:5%}.p7{margin-left:-2%}
  .polaroid figcaption{font-size:13px;white-space:normal;line-height:1.6;padding:0 16px}
  /* 时间线 */
  .timeline::before{left:15px}
  .t-node{padding:0 0 46px 54px}
  .t-star{left:5px;font-size:15px}
  .t-card{font-size:14px;padding:15px 16px}
  /* 便签 */
  .note,.note-inner{min-height:150px}
  .note-back{font-size:15px}
  /* 情书 */
  .letter-paper{padding:32px 22px 30px}
  .wline{font-size:16px;line-height:2.05}
  /* 终章按钮 */
  .btn-yes-only{padding:18px 44px;padding-left:54px;font-size:21px;letter-spacing:.4em}
  .btn-no{margin-top:18px}
  .final-foot{font-size:11px}
  /* 极光性能降级（低端手机 blur 卡顿） */
  .aurora .blob{opacity:.3;filter:blur(70px)}
  .res-line{font-size:15px}
}
@media(max-width:400px){
  .btn-yes-only{padding:16px 34px;padding-left:44px;font-size:18px;letter-spacing:.32em}
  .sec-title{font-size:30px}
}
/* 刘海屏安全区 */
@supports(padding:max(0px)){
  section{padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
  #cover{padding-top:max(24px,env(safe-area-inset-top))}
  footer{padding-bottom:max(44px,env(safe-area-inset-bottom))}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal,.wline{opacity:1;transform:none;filter:none}
}
</style>
</head>
