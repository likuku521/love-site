<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>致小颖 · 星夜情书</title>
<style>
:root{
  --bg0:#0d0618; --bg1:#170a2e; --bg2:#22103f;
  --violet:#c084fc; --fuchsia:#f0abfc; --rose:#f9a8d4;
  --gold:#fcd9a0; --ink:#faf5ff; --ink-dim:#c9b1e0;
  --glass:rgba(255,255,255,.07); --glass-brd:rgba(255,255,255,.16);
  --serif:"KaiTi","STKaiti","楷体",serif;
  --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--ink);font-family:var(--sans);
  overflow-x:hidden;line-height:1.75;font-size:16px}
::selection{background:rgba(192,132,252,.4)}

/* ===== 氛围层：Aurora 极光 + 星点 ===== */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden}
.aurora .blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;
  filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aurora .b1{background:radial-gradient(circle,#7c3aed,transparent 60%);
  top:-15%;left:-10%;animation:drift1 14s ease-in-out infinite alternate}
.aurora .b2{background:radial-gradient(circle,#d946ef,transparent 60%);
  top:10%;right:-18%;animation:drift2 18s ease-in-out infinite alternate}
.aurora .b3{background:radial-gradient(circle,#a21caf,transparent 62%);
  bottom:-20%;left:15%;animation:drift3 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vw,14vh) scale(.9)}}
@keyframes drift3{to{transform:translate(8vw,-10vh) scale(1.2)}}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.shooting{position:fixed;width:120px;height:1.5px;z-index:-2;pointer-events:none;
  background:linear-gradient(90deg,#fff,transparent);border-radius:2px;
  transform:rotate(-35deg);opacity:0;animation:shoot 9s linear infinite}
.shooting.s2{animation-delay:4.5s;top:60%}
@keyframes shoot{0%,6%{transform:rotate(-35deg) translateX(0);opacity:0}
  7%{opacity:1}14%{transform:rotate(-35deg) translateX(-70vw);opacity:0}100%{opacity:0}}

/* ===== 通用编舞基元 ===== */
.reveal{opacity:0;transform:translateY(44px);filter:blur(4px);
  transition:opacity .9s ease var(--delay,0s),transform .9s cubic-bezier(.2,.7,.2,1) var(--delay,0s),
  filter .9s ease var(--delay,0s)}
.reveal.visible{opacity:1;transform:none;filter:blur(0)}
section{position:relative;padding:16vh 0 8vh}
main{max-width:760px;margin:0 auto;padding:0 22px}
.ch-tag{display:inline-block;font-size:12px;letter-spacing:.5em;color:var(--fuchsia);
  border:1px solid rgba(240,171,252,.3);padding:6px 18px 6px 22px;border-radius:99px;margin-bottom:22px}
.sec-title{font-family:var(--serif);font-size:clamp(34px,8vw,54px);line-height:1.3;
  background:linear-gradient(120deg,var(--fuchsia),var(--rose) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.sec-sub{color:var(--ink-dim);font-size:14px;letter-spacing:.18em;margin-bottom:56px}
.center{text-align:center}
</style>
