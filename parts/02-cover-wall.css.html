<style>
/* ===== 封面 ===== */
#cover{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px}
#heartCanvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
.hero-kicker{letter-spacing:.65em;font-size:clamp(12px,2.6vw,15px);color:var(--fuchsia);
  opacity:0;animation:riseIn 1s cubic-bezier(.2,.7,.2,1) .2s forwards}
.hero-name{font-family:var(--serif);font-size:clamp(64px,17vw,120px);line-height:1.15;
  margin:14px 0 10px;font-weight:400;
  background:linear-gradient(120deg,#f5d0fe 0%,var(--fuchsia) 40%,var(--rose) 75%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(240,171,252,.35));
  opacity:0;animation:riseIn 1.1s cubic-bezier(.2,.7,.2,1) .55s forwards}
.hero-line{color:var(--ink-dim);font-size:clamp(13px,3vw,16px);letter-spacing:.4em;
  opacity:0;animation:riseIn 1s cubic-bezier(.2,.7,.2,1) 1s forwards}
.hero-date{margin-top:20px;font-size:13px;letter-spacing:.3em;color:var(--gold);
  opacity:0;animation:riseIn 1s ease 1.4s forwards}
.btn-pulse{position:relative;margin-top:64px;width:120px;height:120px;border-radius:50%;
  border:none;cursor:pointer;color:#fff;font-size:17px;letter-spacing:.18em;font-family:var(--serif);
  background:radial-gradient(circle at 35% 30%,#e879f9,#a21caf 70%);
  box-shadow:0 0 0 0 rgba(232,121,249,.5),0 10px 40px rgba(162,28,175,.55);
  opacity:0;animation:riseIn .9s ease 1.9s forwards,heartbeat 1.8s ease-in-out 2.8s infinite;
  transition:transform .25s}
.btn-pulse:hover{transform:scale(1.06)}
.btn-pulse:active{transform:scale(.95)}
@keyframes heartbeat{0%,100%{box-shadow:0 0 0 0 rgba(232,121,249,.45),0 10px 40px rgba(162,28,175,.55)}
  30%{box-shadow:0 0 0 22px rgba(232,121,249,0),0 10px 40px rgba(162,28,175,.55)}}
@keyframes riseIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.scroll-hint{position:absolute;bottom:30px;font-size:11px;letter-spacing:.4em;color:var(--ink-dim);
  opacity:0;animation:riseIn 1s ease 2.5s forwards}
.scroll-hint::after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;
  background:linear-gradient(180deg,var(--fuchsia),transparent);animation:dropLine 1.6s ease-in-out infinite}
@keyframes dropLine{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}
  56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* 倒计时层 */
#countdown{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#2a1148,#0b0516 78%)}
#countdown.show{display:flex}
#cdNum{font-family:var(--serif);font-size:clamp(140px,44vw,300px);line-height:1;
  background:linear-gradient(135deg,#f5d0fe,var(--violet));-webkit-background-clip:text;background-clip:text;
  color:transparent;opacity:0;transform:scale(1.7);filter:blur(6px)}
#cdNum.pop{animation:countPop 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes countPop{0%{opacity:0;transform:scale(1.7);filter:blur(6px)}
  35%{opacity:1;transform:scale(.94);filter:blur(0)}
  75%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
#cdTag{position:absolute;bottom:18vh;letter-spacing:.5em;font-size:14px;color:var(--ink-dim);opacity:0}
#cdTag.show{animation:riseIn 1s ease forwards}

/* ===== 宝丽来照片墙（视差散落） ===== */
#photos .wall{position:relative;display:grid;grid-template-columns:repeat(6,1fr);
  gap:26px 20px;padding:10px 0 30px}
.polaroid{position:relative;background:#fdfbf7;padding:10px 10px 46px;border-radius:4px;
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  transform:rotate(var(--rot,0deg));transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;
  will-change:transform}
.polaroid:hover{transform:rotate(0deg) scale(1.05) translateY(-8px);z-index:5;
  box-shadow:0 26px 60px rgba(0,0,0,.6),0 0 0 1px rgba(240,171,252,.25)}
.polaroid img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;border-radius:2px;
  background:#1c1030;filter:saturate(1.05) contrast(1.03)}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:8px;text-align:center;
  font-family:var(--serif);font-size:14px;color:#5b4a68;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.polaroid .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0abfc,#a21caf);
  box-shadow:0 3px 6px rgba(0,0,0,.4)}
.p1{grid-column:1/4}.p2{grid-column:4/7;margin-top:44px}
.p3{grid-column:1/3;margin-top:-16px}.p4{grid-column:3/5;margin-top:26px}.p5{grid-column:5/7;margin-top:-8px}
.p6{grid-column:1/4;margin-top:30px}.p7{grid-column:4/7;margin-top:60px}
@media(max-width:640px){
  #photos .wall{grid-template-columns:1fr 1fr;gap:20px 14px}
  .p1,.p2,.p3,.p4,.p5,.p6,.p7{grid-column:auto;margin-top:0}
  .p2,.p4,.p6{margin-top:34px}
}

/* ===== 星光时间线 ===== */
.timeline{position:relative;padding:8px 0 40px;max-width:620px;margin:0 auto}
.timeline::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,rgba(192,132,252,.65) 15%,rgba(192,132,252,.65) 85%,transparent)}
.t-node{position:relative;padding:0 0 58px 62px}
.t-star{position:absolute;left:8px;top:4px;width:24px;height:24px;display:grid;place-items:center;
  color:#6b4a8f;font-size:18px;transition:color .8s,text-shadow .8s,transform .8s}
.t-node.lit .t-star{color:var(--gold);text-shadow:0 0 14px var(--gold),0 0 34px rgba(252,217,160,.6);
  transform:scale(1.25) rotate(18deg)}
.t-date{font-size:13px;letter-spacing:.22em;color:var(--fuchsia);margin-bottom:8px;font-weight:700}
.t-card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;
  padding:18px 20px;font-size:15px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.t-card b{color:var(--rose)}
</style>
